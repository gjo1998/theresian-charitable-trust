<header
  data-sticky
  class="sticky top-0 z-40 bg-cream/95 backdrop-blur-md transition-shadow duration-300"
  [class.shadow-soft]="scrolled()"
>
  <div class="container-page">
    @if (onStory()) {
      <!-- Story pages: back, logo in the centre, one call to action -->
      <div class="grid grid-cols-[1fr_auto_1fr] items-center h-20 gap-3">
        <a
          routerLink="/"
          class="justify-self-start inline-flex items-center gap-2 rounded-full px-3 py-2 -ms-3 font-bold text-sage hover:bg-sage-soft transition-colors"
        >
          <app-icon name="arrow-left" />
          <span class="hidden sm:inline">{{ labels.backToHome }}</span>
          <span class="sm:hidden">{{ labels.backToHomeShort }}</span>
        </a>

        <a routerLink="/" [attr.aria-label]="labels.homeAriaLabel">
          <app-logo />
        </a>

        <a
          [routerLink]="cta.path"
          [fragment]="cta.fragment"
          class="justify-self-end btn btn-peach !hidden md:!inline-flex !py-3 !px-6"
        >
          {{ cta.label }}
        </a>
      </div>
    } @else {
      <div class="flex items-center justify-between h-20 gap-4">
        <a routerLink="/" (click)="closeMenu()" [attr.aria-label]="labels.homeAriaLabel">
          <app-logo />
        </a>

        <!-- Desktop navigation -->
        <nav class="hidden lg:flex items-center gap-7 text-[16px] font-bold text-ink" [attr.aria-label]="labels.mainNavLabel">
          @for (link of navLinks; track link.label) {
            <a
              [routerLink]="link.path"
              [fragment]="link.fragment"
              class="inline-flex items-center min-h-[44px] px-1 hover:text-sage transition-colors"
            >
              {{ link.label }}
            </a>
          }
        </nav>

        <div class="flex items-center gap-2">
          <a
            [routerLink]="cta.path"
            [fragment]="cta.fragment"
            (click)="closeMenu()"
            class="btn btn-peach !hidden sm:!inline-flex !py-3 !px-6"
          >
            {{ cta.label }}
          </a>

          <button
            type="button"
            (click)="toggleMenu()"
            class="lg:hidden inline-flex items-center justify-center w-11 h-11 rounded-full bg-sage-soft text-sage"
            [attr.aria-expanded]="menuOpen()"
            aria-controls="mobileNav"
            [attr.aria-label]="menuOpen() ? labels.closeMenu : labels.openMenu"
          >
            <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="24" />
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Mobile drawer -->
  @if (menuOpen() && !onStory()) {
    <nav id="mobileNav" class="lg:hidden bg-cream border-t border-sage-soft px-4 py-4 space-y-1 shadow-soft">
      @for (link of navLinks; track link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          (click)="closeMenu()"
          class="block rounded-2xl px-4 py-3 font-bold text-ink hover:bg-sage-soft"
        >
          {{ link.label }}
        </a>
      }
      <a
        [routerLink]="cta.path"
        [fragment]="cta.fragment"
        (click)="closeMenu()"
        class="btn btn-peach w-full mt-2"
      >
        {{ cta.label }}
      </a>
    </nav>
  }
</header>
