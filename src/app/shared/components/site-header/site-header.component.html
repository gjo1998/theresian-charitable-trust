<header
  class="sticky top-0 z-40 bg-white/95 backdrop-blur-md transition-shadow duration-300"
  [class]="scrolled() ? 'shadow-lg' : 'shadow-sm'"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20 gap-4">
      <a routerLink="/" (click)="closeMenu()" aria-label="Ammaveedu, home">
        <app-logo />
      </a>

      <!-- Desktop navigation -->
      <nav class="hidden lg:flex items-center gap-8 text-[15px] font-semibold text-ink-soft">
        @for (link of navLinks; track link.label) {
          @if (link.path) {
            <a [routerLink]="link.path" class="hover:text-leaf transition-colors">{{ link.label }}</a>
          } @else {
            <a routerLink="/" [fragment]="link.fragment" class="hover:text-leaf transition-colors">
              {{ link.label }}
            </a>
          }
        }
      </nav>

      <div class="flex items-center gap-2">
        <a
          routerLink="/"
          fragment="family"
          (click)="closeMenu()"
          class="hidden sm:inline-flex items-center rounded-full bg-mango px-6 py-3 font-heading font-bold text-ink hover:brightness-95 transition"
        >
          Be family
        </a>

        <button
          type="button"
          (click)="toggleMenu()"
          class="lg:hidden inline-flex items-center justify-center w-11 h-11 rounded-full bg-leaf-soft text-leaf-deep"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="mobileNav"
          [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        >
          @if (menuOpen()) {
            <svg viewBox="0 0 24 24" class="w-6 h-6" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" class="w-6 h-6" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (menuOpen()) {
    <nav id="mobileNav" class="lg:hidden bg-white border-t border-leaf-soft px-4 py-4 space-y-1 shadow-xl">
      @for (link of navLinks; track link.label) {
        @if (link.path) {
          <a
            [routerLink]="link.path"
            (click)="closeMenu()"
            class="block rounded-2xl px-4 py-3 font-semibold text-ink hover:bg-leaf-soft"
          >
            {{ link.label }}
          </a>
        } @else {
          <a
            routerLink="/"
            [fragment]="link.fragment"
            (click)="closeMenu()"
            class="block rounded-2xl px-4 py-3 font-semibold text-ink hover:bg-leaf-soft"
          >
            {{ link.label }}
          </a>
        }
      }
      <a
        routerLink="/"
        fragment="family"
        (click)="closeMenu()"
        class="block text-center rounded-full bg-mango px-6 py-3 font-heading font-bold text-ink"
      >
        Be family
      </a>
    </nav>
  }
</header>
