<footer class="bg-ink text-white/80">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
    <div class="grid gap-10 md:grid-cols-2 items-start">
      <div class="space-y-5">
        <app-logo [onDark]="true" />
        <p class="text-sm leading-relaxed max-w-md">
          {{ trust.legalName }} &middot; {{ trust.address.line3 }}, {{ trust.address.district }} -
          {{ trust.address.pin }}, {{ trust.address.state }}
        </p>
        <p class="text-sm">
          <a [href]="'mailto:' + trust.email" class="hover:text-mango transition-colors break-all">
            {{ trust.email }}
          </a>
          <span class="mx-2 text-white/30">|</span>
          <a [href]="'tel:+' + trust.phoneE164" class="hover:text-mango transition-colors">{{ trust.phone }}</a>
        </p>
      </div>

      <div class="space-y-5 md:text-right">
        <blockquote class="font-heading text-lg sm:text-xl text-white/95 leading-snug">
          &ldquo;{{ quote.text }}&rdquo;
        </blockquote>
        <a
          routerLink="/stories"
          class="inline-flex items-center gap-2 rounded-full bg-mango px-6 py-3 font-heading font-bold text-ink hover:brightness-95 transition"
        >
          Read our story
        </a>
      </div>
    </div>

    <p class="mt-12 pt-6 border-t border-white/10 text-xs text-white/50">
      &copy; {{ currentYear }} {{ trust.legalName }}. Photographs by the trust.
    </p>
  </div>
</footer>
